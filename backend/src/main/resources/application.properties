spring.application.name=backend

# ===============================
# Swagger UI / OpenAPI Config
# ===============================
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# ===============================
# Database Configuration
# Mặc định dùng H2 (tương thích MSSQL) cho môi trường dev khi chưa cấu hình DB_URL.
# Khi kết nối SQL Server thật: thiết lập DB_URL=jdbc:sqlserver://localhost:1433;databaseName=nongsan;encrypt=true;trustServerCertificate=true
# ===============================
spring.datasource.url=${DB_URL:jdbc:h2:mem:nongsan;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MSSQLServer}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true