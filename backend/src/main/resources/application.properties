spring.application.name=backend
server.port=${SERVER_PORT:8080}

# ==========================================
# Database: SQL Server
# Tao DB + bang bang script trong resources/db/ (01_create_database.sql, 02_users.sql) truoc khi chay.
# Ghi de bang bien moi truong (DB_URL, DB_USERNAME, DB_PASSWORD)
# hoac tao application-local.properties (xem file .example) va chay voi profile "local".
# ==========================================
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=nongsan_db;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ==========================================
# JPA / Hibernate
# ddl-auto=update tien cho dev; schema chinh thuc theo ERD cua nhom (moi thay doi bang phai bao nhom).
# ==========================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Upload anh san pham
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==========================================
# Swagger / OpenAPI  ->  http://localhost:8080/swagger-ui.html
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================
# Cau hinh rieng cua he thong (map vao AppProperties)
# ==========================================
# JWT ky bang HS256 -> secret phai >= 32 ky tu. Gia tri mac dinh CHI dung cho dev.
app.jwt.secret=${JWT_SECRET:nhom5-dev-secret-change-me-in-production-0123456789abcdef}
# Han access token (phut). Tai lieu auth: ~1 gio.
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Dang nhap Google: OAuth Client ID tren Google Cloud Console. De trong -> /api/auth/google tra 503.
app.google.client-id=${GOOGLE_CLIENT_ID:}

# Tai khoan ADMIN dau tien, tu tao khi khoi dong neu chua co ADMIN nao (AdminSeeder).
# Mat khau mac dinh CHI cho dev - dat ADMIN_PASSWORD truoc khi demo.
app.admin.email=${ADMIN_EMAIL:admin@nongsan.local}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.admin.full-name=${ADMIN_FULL_NAME:Quan tri vien}

# AI service (Python FastAPI). Backend goi sang day; frontend KHONG goi thang.
app.ai.base-url=${AI_SERVICE_URL:http://localhost:8000}
# Nguong tin cay: >= nguong -> tu chap nhan nhan AI; < nguong -> dua vao hang cho admin kiem dinh
app.ai.auto-accept-threshold=${AI_AUTO_ACCEPT_THRESHOLD:0.85}

# CORS cho frontend Vite (nhieu origin cach nhau boi dau phay)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
